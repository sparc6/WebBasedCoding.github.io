<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Görev Seçimi - Bilişim Garajı Python Eğitim Platformu</title>
    <link rel="stylesheet" href="styles.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Task Selection Screen -->
    <div class="level-selection-screen" id="levelSelectionScreen">
      <div class="level-selection-container">
        <div class="level-header">
          <div class="level-logo">
            <img src="Images and Logos/bilisim-garaj-logo.png" alt="Bilisim Garaj Logo" class="logo-image">
            <h1 id="categoryTitle">Kategori Seçildi</h1>
          </div>
          <button class="btn btn-secondary" id="backToCategoriesBtn">← Kategoriler</button>
        </div>
        
        <!-- Zigzag Path -->
        <div class="zigzag-path" id="zigzagPath">
          <div class="path-container">
            <div class="zigzag-container" id="zigzagContainer">
              <!-- Task nodes will be populated by JavaScript -->
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Scripts -->
    <script src="js/task-selection.js"></script>
  </body>
</html>
