<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bilişim Garajı Python Eğitim Platformu</title>
    <link rel="stylesheet" href="styles.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/theme/monokai.min.css"
    />
    <!-- Pyodide CDN -->
    <script src="https://cdn.jsdelivr.net/pyodide/v0.24.1/full/pyodide.js"></script>
  </head>
  <body>
    <div class="app-container" id="appContainer">
      <!-- Back to Categories Button - Top Left -->
      <button class="back-to-categories-floating" id="backToCategoriesBtn">
        <span class="button-text">Görev Listesi</span>
      </button>

      <!-- Header -->
      <div class="editor-header-section">
        <div class="editor-header-container">
          <div class="level-header">
            <div class="level-logo">
              <img src="Images and Logos/bilisim-garaj-logo.png" alt="Bilisim Garaj Logo" class="logo-image">
              <h1>Bilişim Garajı Python Eğitim Platformu</h1>
            </div>
          </div>
          
          <!-- Editor Info Panel -->
          <div class="editor-info-panel">
            <!-- Stats Section: Level, Progress & Points -->
            <div class="editor-stats-section">
              <div class="level-card">
                <div class="level-icon-container">
                  <div class="level-icon-bg">
                    <span class="level-icon">🏆</span>
                  </div>
                  <div class="level-info">
                    <span class="level-label">Görev</span>
                    <span class="level-number">1</span>
                  </div>
                </div>
              </div>
              
              <div class="progress-card">
                <div class="progress-header">
                  <span class="progress-label">İlerleme</span>
                  <span class="progress-percentage">0%</span>
                </div>
                <div class="progress-bar-container">
                  <div class="progress-bar">
                    <div class="progress-fill" style="width: 0%"></div>
                    <div class="progress-glow"></div>
                  </div>
                </div>
                <div class="progress-stats">
                  <span class="completed-tasks">Tamamlanan: 0/10</span>
                  <span class="progress-icon">📈</span>
                </div>
              </div>
              
              <div class="points-card">
                <div class="points-icon-container">
                  <div class="points-icon-bg">
                    <span class="points-icon">⭐</span>
                  </div>
                  <div class="points-info">
                    <span class="points-label">Toplam Puan</span>
                    <span class="points-number">0</span>
                  </div>
                </div>
              </div>
            </div>
          </div>
          
          <!-- Top Right Actions -->
          <div class="top-right-actions">
            <button class="top-action-btn theme-btn" id="themeBtn" title="Tema Değiştir">
              <span class="btn-icon">🌙</span>
            </button>
            <button class="top-action-btn profile-btn" id="profileBtn" title="Profil">
              <span class="btn-icon">👤</span>
            </button>
            <button class="top-action-btn help-btn" id="helpBtn" title="Yardım">
              <span class="btn-icon">❓</span>
            </button>
          </div>
        </div>
      </div>

      <!-- Main Content -->
      <main class="main-content">
        <!-- Sidebar -->
        <aside class="sidebar">
          <div class="sidebar-section">
            <div class="sidebar-header">
              <h3>📚 Görev</h3>
            </div>
            <div class="task-list" id="taskList">
              <!-- Tasks will be populated by JavaScript -->
            </div>
          </div>
        </aside>

        <!-- Editor Area -->
        <section class="editor-area">
          <div class="editor-header">
            <div class="task-title-section">
              <div class="editor-brand">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" class="code-icon">
                  <path d="M8 18L3 12L8 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                  <path d="M16 6L21 12L16 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <h2 class="editor-title">Python</h2>
              </div>
            </div>
            <div class="editor-controls">
              <button class="btn btn-run" id="runBtn">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                  <path d="M8 5v14l11-7z"/>
                </svg>
                Çalıştır
              </button>
              <button class="btn btn-reset" id="resetBtn">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                  <path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
                </svg>
                Sıfırla
              </button>
              <button class="btn btn-hint" id="hintBtn">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                  <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 17h-2v-6h2v6zm0-8h-2V7h2v4z"/>
                </svg>
                İpucu
              </button>
              <button class="btn btn-download" id="downloadBtn">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                  <path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/>
                </svg>
                İndir
              </button>
              <button class="btn btn-upload" id="uploadBtn" style="display: none;">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                  <path d="M9 16h6v-6h4l-7-7-7 7h4zm-4 2h14v2H5z"/>
                </svg>
                Yükle
              </button>
              <input type="file" id="fileInput" accept=".py,.txt" style="display: none;">
            </div>
          </div>

          <div class="editor-container">
            <textarea id="codeEditor"></textarea>
            
            <!-- Floating Font Controls -->
            <div class="floating-font-controls">
              <div class="font-control-panel">
                <button class="font-btn" id="fontIncreaseBtn" title="Font Büyüt">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    <line x1="11" y1="8" x2="11" y2="14"></line>
                    <line x1="8" y1="11" x2="14" y2="11"></line>
                  </svg>
                </button>
                <button class="font-btn" id="fontDecreaseBtn" title="Font Küçült">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    <line x1="8" y1="11" x2="14" y2="11"></line>
                  </svg>
                </button>
                <button class="font-btn" id="fontResetBtn" title="Varsayılan Boyut">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="8" y1="10" x2="16" y2="10"></line>
                    <line x1="8" y1="14" x2="16" y2="14"></line>
                  </svg>
                </button>
              </div>
            </div>
          </div>
        </section>

        <!-- Output Panel -->
        <section class="output-panel">
          <div class="output-header">
            <h3>📤 Çıktı</h3>
            <button class="btn btn-sm" id="clearOutputBtn">Temizle</button>
          </div>
          <div class="output-content" id="outputContent">
            <!-- Output will be displayed here -->
          </div>
        </section>
      </main>
      
      <!-- GIF Animation Container -->
      <div class="gif-container" id="gifContainer">
        <div class="gif-animation" id="gifAnimation"></div>
      </div>
    </div>

    <!-- Hint Modal -->
    <div class="hint-modal" id="hintModal">
      <div class="hint-modal-header" id="hintModalHeader">
        <div class="hint-modal-title">
          <span class="hint-icon">💡</span>
          <span class="hint-title">İpucu</span>
        </div>
        <div class="hint-modal-controls">
          <button class="hint-pin-btn" id="hintPinBtn" title="Sabitle/Çöz">📌</button>
          <button class="hint-close-btn" id="hintCloseBtn">×</button>
        </div>
      </div>
      <div class="hint-modal-content">
        <div class="hint-tabs">
          <button class="hint-tab active" id="shortHintTab">Kısa İpucu</button>
          <button class="hint-tab" id="longHintTab">Uzun İpucu</button>
        </div>
        <div class="hint-content">
          <div class="hint-tab-content active" id="shortHintContent">
            <div class="hint-text" id="shortHintText">
              <!-- Short hint content will be loaded here -->
            </div>
          </div>
          <div class="hint-tab-content" id="longHintContent">
            <div class="hint-text" id="longHintText">
              <!-- Long hint content will be loaded here -->
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/python/python.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/addon/hint/show-hint.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/addon/hint/python-hint.min.js"></script>
    <script src="js/editor.js"></script>
  </body>
</html>
